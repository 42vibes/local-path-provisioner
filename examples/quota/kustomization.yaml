apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../deploy

configMapGenerator:
- name: local-path-config
  namespace: local-path-storage
  behavior: merge
  files:
  - config.json
  - helperPod.yaml
  - setup
  - setup-xfs-project-quota
  - teardown
  - teardown-xfs-project-quota

generatorOptions:
  disableNameSuffixHash: true
