apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../deploy

patches:
- path: enable-xfs-quota-patch.yaml

configMapGenerator:
- name: local-path-config
  namespace: local-path-storage
  behavior: merge
  files:
  - config.json
  - helperPod.yaml
  - setup
  - teardown

generatorOptions:
  disableNameSuffixHash: true
