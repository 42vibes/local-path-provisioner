apiVersion: v1
kind: Namespace
metadata:
  name: local-path-storage
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-path
provisioner: rancher.io/local-path
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: local-path-provisioner-service-account
  namespace: local-path-storage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: local-path-provisioner-role
  namespace: local-path-storage
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
  - create
  - patch
  - update
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: local-path-provisioner-role
rules:
- apiGroups:
  - ""
  resources:
  - nodes
  - persistentvolumeclaims
  - configmaps
  - pods
  - pods/log
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - persistentvolumes
  verbs:
  - get
  - list
  - watch
  - create
  - patch
  - update
  - delete
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - storage.k8s.io
  resources:
  - storageclasses
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: local-path-provisioner-bind
  namespace: local-path-storage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: local-path-provisioner-role
subjects:
- kind: ServiceAccount
  name: local-path-provisioner-service-account
  namespace: local-path-storage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: local-path-provisioner-bind
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: local-path-provisioner-role
subjects:
- kind: ServiceAccount
  name: local-path-provisioner-service-account
  namespace: local-path-storage
---
apiVersion: v1
data:
  config.json: |
    {
      "storageClassConfigs": {
        "local-path": {
          "nodePathMap": [
            {
              "node": "DEFAULT_PATH_FOR_NON_LISTED_NODES",
              "paths": ["/mnt/disk"]
            }
          ],
          "quota": {
            "type": "xfsProject"
          }
        }
      }
    }
  helperPod.yaml: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: helper-pod
    spec:
      containers:
      - name: helper-pod
        image: local-path-xfs-quota-helper:e2e
        imagePullPolicy: IfNotPresent
  setup: |
    #!/bin/sh
    set -eu
    mkdir -m 0777 -p "$VOL_DIR"
  setup-xfs-project-quota: |
    #!/bin/sh
    set -eu

    require_command() {
        command -v "$1" >/dev/null 2>&1 || {
            echo "required command not found: $1" >&2
            exit 1
        }
    }

    require_command awk
    require_command dirname
    require_command mkdir
    require_command rmdir
    require_command sed
    require_command sleep
    require_command stat
    require_command xfs_quota

    if [ "${LOCAL_PATH_QUOTA_TYPE:-}" != "xfsProject" ]; then
        mkdir -m 0777 -p "$VOL_DIR"
        exit 0
    fi

    if [ -z "${VOL_NAME:-}" ]; then
        echo "VOL_NAME must be set when quota is enabled" >&2
        exit 1
    fi

    if [ "${VOL_SIZE_BYTES:-0}" -le 0 ]; then
        echo "VOL_SIZE_BYTES must be greater than 0 when quota is enabled" >&2
        exit 1
    fi

    xfs_path=$(dirname "$VOL_DIR")
    project_name=$(printf "%s" "$VOL_NAME" | sed 's/[^A-Za-z0-9_.-]/_/g')
    projects_file="${LOCAL_PATH_QUOTA_PROJECTS_FILE:-/etc/projects}"
    projid_file="${LOCAL_PATH_QUOTA_PROJID_FILE:-/etc/projid}"
    lock_dir="${LOCAL_PATH_QUOTA_LOCK_DIR:-/var/lib/local-path-provisioner/quota-lock}"
    project_id_start="${LOCAL_PATH_QUOTA_PROJECT_ID_START:-1048576}"
    project_id_end="${LOCAL_PATH_QUOTA_PROJECT_ID_END:-2147483647}"

    fs_type=$(stat -f -c %T "$xfs_path")
    if [ "$fs_type" != "xfs" ]; then
        echo "quota type xfsProject requires xfs filesystem at $xfs_path, got $fs_type" >&2
        exit 1
    fi

    mkdir -m 0777 -p "$VOL_DIR"
    mkdir -p "$lock_dir"

    lock_path="$lock_dir/projects.lock"
    while ! mkdir "$lock_path" 2>/dev/null; do
        sleep 1
    done
    trap 'rmdir "$lock_path"' EXIT

    existing_id=$(awk -F: -v path="$VOL_DIR" '$2 == path { print $1; exit }' "$projects_file" 2>/dev/null || true)
    if [ -n "$existing_id" ]; then
        project_id="$existing_id"
    else
        project_id=$(awk -F: -v start="$project_id_start" -v end="$project_id_end" '
            BEGIN { candidate = start }
            $1 ~ /^[0-9]+$/ && $1 >= candidate { candidate = $1 + 1 }
            END {
                if (candidate > end) {
                    exit 2
                }
                print candidate
            }
        ' "$projects_file") || {
            echo "no available XFS project id in range $project_id_start-$project_id_end" >&2
            exit 1
        }
        printf "%s:%s\n" "$project_id" "$VOL_DIR" >> "$projects_file"
    fi

    if ! awk -F: -v name="$project_name" '$1 == name { found = 1 } END { exit found ? 0 : 1 }' "$projid_file" 2>/dev/null; then
        printf "%s:%s\n" "$project_name" "$project_id" >> "$projid_file"
    fi

    xfs_quota -x -c "project -s $project_name" "$xfs_path"
    xfs_quota -x -c "limit -p bhard=$VOL_SIZE_BYTES $project_name" "$xfs_path"
  teardown: |
    #!/bin/sh
    set -eu
    rm -rf "$VOL_DIR"
  teardown-xfs-project-quota: |
    #!/bin/sh
    set -eu

    require_command() {
        command -v "$1" >/dev/null 2>&1 || {
            echo "required command not found: $1" >&2
            exit 1
        }
    }

    require_command awk
    require_command cat
    require_command dirname
    require_command mkdir
    require_command rm
    require_command rmdir
    require_command sed
    require_command sleep
    require_command stat
    require_command xfs_quota

    if [ "${LOCAL_PATH_QUOTA_TYPE:-}" != "xfsProject" ]; then
        rm -rf "$VOL_DIR"
        exit 0
    fi

    if [ -z "${VOL_NAME:-}" ]; then
        echo "VOL_NAME must be set when quota is enabled" >&2
        exit 1
    fi

    xfs_path=$(dirname "$VOL_DIR")
    project_name=$(printf "%s" "$VOL_NAME" | sed 's/[^A-Za-z0-9_.-]/_/g')
    projects_file="${LOCAL_PATH_QUOTA_PROJECTS_FILE:-/etc/projects}"
    projid_file="${LOCAL_PATH_QUOTA_PROJID_FILE:-/etc/projid}"
    lock_dir="${LOCAL_PATH_QUOTA_LOCK_DIR:-/var/lib/local-path-provisioner/quota-lock}"

    fs_type=$(stat -f -c %T "$xfs_path")
    if [ "$fs_type" != "xfs" ]; then
        echo "quota type xfsProject requires xfs filesystem at $xfs_path, got $fs_type" >&2
        exit 1
    fi

    xfs_quota -x -c "limit -p bhard=0 $project_name" "$xfs_path"
    rm -rf "$VOL_DIR"
    mkdir -p "$lock_dir"

    lock_path="$lock_dir/projects.lock"
    while ! mkdir "$lock_path" 2>/dev/null; do
        sleep 1
    done
    trap 'rmdir "$lock_path"' EXIT

    tmp_projects="${projects_file}.local-path.$$"
    tmp_projid="${projid_file}.local-path.$$"
    awk -F: -v path="$VOL_DIR" '$2 != path' "$projects_file" > "$tmp_projects"
    awk -F: -v name="$project_name" '$1 != name' "$projid_file" > "$tmp_projid"
    cat "$tmp_projects" > "$projects_file"
    cat "$tmp_projid" > "$projid_file"
    rm -f "$tmp_projects" "$tmp_projid"
kind: ConfigMap
metadata:
  name: local-path-config
  namespace: local-path-storage
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-path-provisioner
  namespace: local-path-storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: local-path-provisioner
  template:
    metadata:
      labels:
        app: local-path-provisioner
    spec:
      containers:
      - command:
        - local-path-provisioner
        - --debug
        - start
        - --config
        - /etc/config/config.json
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: CONFIG_MOUNT_PATH
          value: /etc/config/
        image: docker.io/rancher/local-path-provisioner:v0.0.36
        imagePullPolicy: IfNotPresent
        name: local-path-provisioner
        volumeMounts:
        - mountPath: /etc/config/
          name: config-volume
      serviceAccountName: local-path-provisioner-service-account
      volumes:
      - configMap:
          name: local-path-config
        name: config-volume
